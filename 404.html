<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>До нуля</title>
  <script>
    const parts = window.location.pathname.split("/").filter(Boolean);
    window.location.replace(parts.length ? `/${parts[0]}/` : "/");
  </script>
</head>
<body>
  <a href="./">Открыть проект До нуля</a>
</body>
</html>
