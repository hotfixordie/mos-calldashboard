<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>До нуля · Дашборд юристы</title>
  <style>
    :root {
      --brand: #b43e41;
      --ink: #1f1f1f;
      --text: #343434;
      --muted: #6d7278;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --line: #deded8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .panel {
      width: min(760px, 100%);
      padding: 34px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    a {
      color: var(--brand);
      font-weight: 800;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--ink);
      font-size: 36px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Дашборд юристы</h1>
    <p>Папка создана. Здесь будет отдельный дашборд по юридическому блоку.</p>
    <a href="../">Назад в проект</a>
  </main>
</body>
</html>
